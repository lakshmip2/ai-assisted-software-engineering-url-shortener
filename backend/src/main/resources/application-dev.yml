spring:

  datasource:
    url: jdbc:h2:mem:urlshortenerdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true
app:
  base-url: http://localhost:8080

logging:
  level:
    root: INFO
    com.schwab.aiengineering: DEBUG